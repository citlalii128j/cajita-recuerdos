<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <img src="imagen1.jpeg" width="450px" alt="">

    <title>Mi Cajita de Recuerdos y Notas</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #0f0c0c;
            --primary-hover: #050505;
            --accent-color: #9a8a7f;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #0c0c0c;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #090909;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .notes-section {
            width: 100%;
            max-width: 600px;
        }

        .notes-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #444;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .note-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
            border-left: 5px solid var(--primary-color);
            transition: transform 0.2s;
        }

        .note-card:hover {
            transform: translateY(-2px);
        }

        .note-card h3 {
            margin: 0 0 8px 0;
            color: #333;
            font-size: 1.1rem;
        }

        .note-card p {
            margin: 0 0 10px 0;
            white-space: pre-wrap;
            color: #555;
            line-height: 1.4;
        }

        .note-date {
            font-size: 0.75rem;
            color: #999;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #433f3f;
            cursor: pointer;
            font-size: 1rem;
            width: auto;
            padding: 0;
        }

        .delete-btn:hover {
            color: #090909;
            background: none;
        }

        .empty-msg {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>💖 Mi Cajita de Recuerdos 💖</h1>
        <p>Guarda tus momentos especiales, notas y pequeños detalles.</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="noteTitle">Título del Recuerdo</label>
            <input type="text" id="noteTitle" placeholder="Ej. Un día increíble...">
        </div>
        <div class="form-group">
            <label for="noteContent">¿Qué quieres recordar?</label>
            <textarea id="noteContent" placeholder="Escribe tu nota o recuerdo aquí..."></textarea>
        </div>
        
        <input type="file" id="noteImageInput" accept="image/*">

        <button id="saveBtn">Guardar Recuerdo</button>
    </div>

    <div class="notes-section">
        <h2>Tus Recuerdos Guardados</h2>
        <div id="notesContainer" class="notes-grid">
            <!-- Las notas aparecerán aquí dinámicamente -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadNotes);

        const saveBtn = document.getElementById('saveBtn');
        const noteTitleInput = document.getElementById('noteTitle');
        const noteContentInput = document.getElementById('noteContent');
        const notesContainer = document.getElementById('notesContainer');

        saveBtn.addEventListener('click', () => {
            const title = noteTitleInput.value.trim();
            const content = noteContentInput.value.trim();

            if (!title || !content) {
                alert('Por favor, completa ambos campos para guardar tu recuerdo.');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newNote = {
                id: Date.now(),
                title,
                content,
                date: dateStr
            };

            saveNoteToLocalStorage(newNote);
            renderNotes();

            // Limpiar campos
            noteTitleInput.value = '';
            noteContentInput.value = '';
        });

        function getNotes() {
            const notes = localStorage.getItem('my_memories');
            return notes ? JSON.parse(notes) : [];
        }

        function saveNoteToLocalStorage(note) {
            const notes = getNotes();
            notes.unshift(note); // Agrega la nueva nota al inicio
            localStorage.setItem('my_memories', JSON.stringify(notes));
        }

        function deleteNote(id) {
            let notes = getNotes();
            notes = notes.filter(note => note.id !== id);
            localStorage.setItem('my_memories', JSON.stringify(notes));
            renderNotes();
        }

        function loadNotes() {
            renderNotes();
        }

        function renderNotes() {
            const notes = getNotes();
            notesContainer.innerHTML = '';

            if (notes.length === 0) {
                notesContainer.innerHTML = '<div class="empty-msg">Aún no hay recuerdos guardados. ¡Empieza a escribir uno!</div>';
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteNote(${note.id})" title="Eliminar">🗑️</button>
                    <h3>${escapeHtml(note.title)}</h3>
                    <p>${escapeHtml(note.content)}</p>
                    <span class="note-date">${note.date}</span>
                `;
                notesContainer.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
